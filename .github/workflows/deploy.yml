name: Vercel Preview Deployment

# Biến môi trường chung
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Trigger khi push bất cứ branch nào trừ main
on:
  push:
    branches-ignore:
      - main

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout code
      - uses: actions/checkout@v3

      # Bước 2: Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Bước 3: Setup pnpm (fix lỗi ENOENT)
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8 # Đảm bảo trùng với lock file
          run_install: false

      # Bước 4: Cài dependencies
      - name: Install dependencies
        run: pnpm install

      # Bước 5: Cài Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Bước 6: Pull Vercel env
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Bước 7: Build app
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # Bước 8: Deploy lên Vercel
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
